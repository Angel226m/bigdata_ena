 

services:
  postgres:
    image: postgres:15
    container_name: postgres-ena
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ena_database
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    command: postgres -c shared_buffers=512MB -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-ena
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  data-loader:
    build: 
      context: ./data-loader
    container_name: data-loader-ena
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ena_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: on-failure

volumes:
  postgres-data: